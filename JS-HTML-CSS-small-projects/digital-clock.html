<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digital clock · alarm · stopwatch · timer (all working)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
            padding: 16px; 
        }
        
        .card {
            background: rgba(18, 30, 40, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px; 
            padding: 32px 28px; 
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06); 
            max-width: 760px;
            width: 100%;
        }
        .tabs {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 60px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 8px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            color: #9ab8d9;
            cursor: pointer;
            transition: 0.2s ease;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab-btn i { font-size: 1.2rem; font-style: normal; }
        .tab-btn.active {
            background: #4f9cf7;
            color: #0b1a2e;
            box-shadow: 0 8px 18px rgba(79, 156, 247, 0.3);
        }
        .tab-btn:not(.active):hover {
            background: rgba(255, 255, 255, 0.05);
            color: #c6dfff;
        }
        .panel {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .panel.active { display: flex; }

        .time-display {
            font-size: 4.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            color: #e9f2ff;
            text-shadow: 0 0 18px rgba(79, 156, 247, 0.5);
            line-height: 1.2;
            margin: 4px 0;
            transition: all 0.1s;
        }
        .date-display {
            font-size: 1.1rem;
            color: #8ba9cc;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.35);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid #2e4a62;
        }
        .input-group label {
            font-size: 0.9rem;
            color: #9ab8d9;
        }
        input[type="time"], input[type="number"] {
            background: transparent;
            border: none;
            color: #e9f2ff;
            font-size: 1.2rem;
            font-weight: 500;
            padding: 6px 0;
            outline: none;
            font-variant-numeric: tabular-nums;
        }
        input[type="time"] { width: 120px; }
        input[type="number"] { width: 60px; text-align: center; }
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
        }
        input[type="number"]::-webkit-inner-spin-button {
            opacity: 0.6;
        }
        .btn {
            background: #2e4a62;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-width: 90px;
        }
        .btn:hover {
            background: #3e6282;
            transform: scale(1.02);
        }
        .btn-primary {
            background: #4f9cf7;
            color: #0b1a2e;
        }
        .btn-primary:hover { background: #6cb0ff; }
        .btn-danger {
            background: #d44;
            color: white;
        }
        .btn-danger:hover { background: #e55; }
        .btn-small {
            padding: 8px 18px;
            font-size: 0.9rem;
            min-width: 70px;
        }
        .btn:disabled {
            opacity: 0.45;
            transform: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        .stopwatch-display, .timer-display {
            font-size: 3.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #e9f2ff;
            letter-spacing: 2px;
            text-shadow: 0 0 14px rgba(79, 156, 247, 0.4);
            margin: 4px 0 8px;
        }
        .alarm-status {
            font-size: 1.15rem;
            color: #ffb86b;
            font-weight: 500;
            margin: 4px 0;
            min-height: 2rem;
            text-align: center;
        }
        .alarm-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
            min-height: 44px;
        }
        .alarm-chip {
            background: #1f3447;
            padding: 8px 12px 8px 18px;
            border-radius: 40px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #b8d8ff;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: inset 0 1px 3px #00000055;
            border: 1px solid #2e4a62;
        }
        .alarm-chip button {
            background: transparent;
            border: none;
            color: #ff8888;
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: bold;
            padding: 0 4px;
            line-height: 1;
        }
        .alarm-chip button:hover { color: #ffbbbb; }
        .ringing {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }
        .hint {
            font-size: 0.85rem;
            color: #6e8ba8;
            margin-top: 4px;
            text-align: center;
        }
        .mt-2 { margin-top: 8px; }
        .mt-3 { margin-top: 16px; }
        .timer-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .timer-presets .btn {
            padding: 6px 14px;
            font-size: 0.85rem;
            min-width: auto;
        }
        .timer-progress {
            font-size: 1.0rem;
            color: #8ba9cc;
            font-weight: 500;
        }
        .sw-lap-list {
            max-height: 120px;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px;
            margin-top: 4px;
        }
        .lap-item {
            display: flex;
            justify-content: space-between;
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.25);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.95rem;
            color: #b8d8ff;
        }
        .lap-item span:last-child {
            font-weight: 700;
            color: #e9f2ff;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="clock"><i>🕒</i> Clock</button>
            <button class="tab-btn" data-tab="alarm"><i>⏰</i> Alarm</button>
            <button class="tab-btn" data-tab="stopwatch"><i>⏱️</i> Stopwatch</button>
            <button class="tab-btn" data-tab="timer"><i>⏳</i> Timer</button>
        </div>

        <!-- CLOCK -->
        <div id="clockPanel" class="panel active">
            <div class="time-display" id="clockTime">--:--:--</div>
            <div class="date-display" id="clockDate">---</div>
        </div>

        <!-- ALARM -->
        <div id="alarmPanel" class="panel">
            <div class="time-display" id="alarmTimeDisplay">--:--:--</div>
            <div class="row">
                <div class="input-group">
                    <label>⏰ set</label>
                    <input type="time" id="alarmInput" value="07:30">
                </div>
                <button class="btn btn-primary btn-small" id="setAlarmBtn">➕ Add alarm</button>
            </div>
            <div class="alarm-status" id="alarmStatus"></div>
            <div class="alarm-list" id="alarmList"></div>
            <div class="row">
                <button class="btn btn-danger btn-small" id="stopAlarmBtn" style="display: none;">🔕 Stop ringing</button>
                <button class="btn btn-small" id="snoozeAlarmBtn" style="display: none;">😴 Snooze 5min</button>
            </div>
            <div class="hint">alarm rings at set time — snooze adds 5 minutes</div>
        </div>

        <!-- STOPWATCH -->
        <div id="stopwatchPanel" class="panel">
            <div class="stopwatch-display" id="stopwatchDisplay">00:00.00</div>
            <div class="row">
                <button class="btn btn-primary" id="stopwatchStart">▶ Start</button>
                <button class="btn" id="stopwatchPause">⏸ Pause</button>
                <button class="btn" id="stopwatchLap">⏱ Lap</button>
                <button class="btn btn-danger" id="stopwatchReset">↺ Reset</button>
            </div>
            <div class="sw-lap-list" id="lapList"></div>
        </div>

        <!-- TIMER -->
        <div id="timerPanel" class="panel">
            <div class="timer-display" id="timerDisplay">00:00</div>
            <div class="timer-progress" id="timerProgress"></div>
            <div class="row">
                <div class="input-group">
                    <label>min</label>
                    <input type="number" id="timerMinutes" min="0" max="99" value="5">
                </div>
                <div class="input-group">
                    <label>sec</label>
                    <input type="number" id="timerSeconds" min="0" max="59" value="0">
                </div>
            </div>
            <div class="timer-presets">
                <button class="btn btn-small" data-preset="60">1 min</button>
                <button class="btn btn-small" data-preset="300">5 min</button>
                <button class="btn btn-small" data-preset="600">10 min</button>
                <button class="btn btn-small" data-preset="1500">25 min</button>
            </div>
            <div class="row">
                <button class="btn btn-primary" id="timerStart">▶ Start</button>
                <button class="btn" id="timerPause">⏸ Pause</button>
                <button class="btn btn-danger" id="timerReset">↺ Reset</button>
            </div>
            <div class="hint">set time or use preset, then start</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- SHARED AUDIO ----------
            let audioCtx = null;
            function getAudioCtx() {
                if (!audioCtx) {
                    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                    catch(e) { console.warn('AudioContext not supported'); }
                }
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }
            function beep(freq = 880, duration = 0.25, type = 'sine', vol = 0.4) {
                const ctx = getAudioCtx();
                if (!ctx) return;
                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = type;
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            }

            // ---------- TABS ----------
            const tabs = document.querySelectorAll('.tab-btn');
            const panels = {
                clock: document.getElementById('clockPanel'),
                alarm: document.getElementById('alarmPanel'),
                stopwatch: document.getElementById('stopwatchPanel'),
                timer: document.getElementById('timerPanel')
            };

            tabs.forEach(btn => {
                
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    tabs.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    Object.values(panels).forEach(p => p.classList.remove('active'));
                    panels[tab].classList.add('active');
                });
            });

            // ---------- GLOBAL CLOCK ----------

            const clockTimeEl = document.getElementById('clockTime');

            const clockDateEl = document.getElementById('clockDate');

            const alarmTimeDisplay = document.getElementById('alarmTimeDisplay');

            function updateClock() {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                clockTimeEl.textContent = `${hh}:${mm}:${ss}`;
                alarmTimeDisplay.textContent = `${hh}:${mm}:${ss}`;
                const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                clockDateEl.textContent = now.toLocaleDateString(undefined, opts);
                checkAlarms(hh, mm, ss);
            }
            setInterval(updateClock, 1000);
            updateClock();

            // ---------- ALARM MODULE ----------
            const alarmInput = document.getElementById('alarmInput');
            const setAlarmBtn = document.getElementById('setAlarmBtn');
            const alarmListEl = document.getElementById('alarmList');
            const alarmStatusEl = document.getElementById('alarmStatus');
            const stopAlarmBtn = document.getElementById('stopAlarmBtn');
            const snoozeAlarmBtn = document.getElementById('snoozeAlarmBtn');

            let alarms = [];                // { id, time }
            let ringingAlarm = null;        // { id, time }
            let alarmSoundInterval = null;

            function startAlarmSound() {
                if (alarmSoundInterval) return;
                beep(880, 0.25, 'sine', 0.4);
                alarmSoundInterval = setInterval(() => beep(880, 0.25, 'sine', 0.4), 500);
            }
            function stopAlarmSound() {
                if (alarmSoundInterval) {
                    clearInterval(alarmSoundInterval);
                    alarmSoundInterval = null;
                }
            }
            function stopRinging() {
                stopAlarmSound();
                ringingAlarm = null;
                stopAlarmBtn.style.display = 'none';
                snoozeAlarmBtn.style.display = 'none';
                alarmStatusEl.textContent = '';
                alarmTimeDisplay.classList.remove('ringing');
            }

            function checkAlarms(hh, mm, ss) {
                if (ringingAlarm) return;
                const nowTime = `${hh}:${mm}`;
                for (let al of alarms) {
                    if (al.time === nowTime) {
                        ringingAlarm = { ...al };
                        alarmStatusEl.textContent = `⏰ RINGING! ${al.time} — stop or snooze`;
                        stopAlarmBtn.style.display = 'inline-flex';
                        snoozeAlarmBtn.style.display = 'inline-flex';
                        alarmTimeDisplay.classList.add('ringing');
                        startAlarmSound();
                        break;
                    }
                }
            }

            function renderAlarms() {
                if (alarms.length === 0) {
                    alarmListEl.innerHTML = '<span style="color:#5b7e9c;">no alarms set</span>';
                    return;
                }
                alarmListEl.innerHTML = alarms.map(al => `
                    <div class="alarm-chip" data-id="${al.id}">
                        <span>⏰ ${al.time}</span>
                        <button class="delete-alarm" data-id="${al.id}" title="remove">✕</button>
                    </div>
                `).join('');
                document.querySelectorAll('.delete-alarm').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = Number(btn.dataset.id);
                        alarms = alarms.filter(a => a.id !== id);
                        if (ringingAlarm && ringingAlarm.id === id) stopRinging();
                        renderAlarms();
                    });
                });
            }

            setAlarmBtn.addEventListener('click', () => {
                const timeVal = alarmInput.value;
                if (!timeVal) { alert('pick a time first'); return; }
                if (alarms.some(a => a.time === timeVal)) {
                    alarmStatusEl.textContent = `⚠️ alarm for ${timeVal} already exists`;
                    setTimeout(() => { if (!ringingAlarm) alarmStatusEl.textContent = ''; }, 2000);
                    return;
                }
                alarms.push({ id: Date.now() + Math.random(), time: timeVal });
                renderAlarms();
                alarmStatusEl.textContent = `✅ alarm set for ${timeVal}`;
                setTimeout(() => { if (!ringingAlarm) alarmStatusEl.textContent = ''; }, 2500);
            });

            stopAlarmBtn.addEventListener('click', stopRinging);

            snoozeAlarmBtn.addEventListener('click', () => {
                if (!ringingAlarm) return;
                // snooze: add 5 minutes to current time
                const now = new Date();
                now.setMinutes(now.getMinutes() + 5);
                const snoozeTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                // remove old ringing alarm, add snoozed one if not duplicate
                const oldTime = ringingAlarm.time;
                alarms = alarms.filter(a => a.id !== ringingAlarm.id);
                if (!alarms.some(a => a.time === snoozeTime)) {
                    alarms.push({ id: Date.now() + Math.random(), time: snoozeTime });
                }
                stopRinging();
                renderAlarms();
                alarmStatusEl.textContent = `😴 snoozed to ${snoozeTime}`;
                setTimeout(() => { if (!ringingAlarm) alarmStatusEl.textContent = ''; }, 3000);
            });

            renderAlarms();

            // ---------- STOPWATCH MODULE ----------
            const stopwatchDisplay = document.getElementById('stopwatchDisplay');
            const swStart = document.getElementById('stopwatchStart');
            const swPause = document.getElementById('stopwatchPause');
            const swLap = document.getElementById('stopwatchLap');
            const swReset = document.getElementById('stopwatchReset');
            const lapListEl = document.getElementById('lapList');

            let swRunning = false;
            let swStartTime = 0;
            let swElapsed = 0;              // accumulated ms when paused
            let swInterval = null;
            let swLaps = [];                // array of ms

            function formatStopwatch(ms) {
                const totalSec = Math.floor(ms / 1000);
                const minutes = Math.floor(totalSec / 60);
                const seconds = totalSec % 60;
                const hundredths = Math.floor((ms % 1000) / 10);
                return `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}.${String(hundredths).padStart(2,'0')}`;
            }

            function getCurrentStopwatchMs() {
                if (swRunning) {
                    return swElapsed + (performance.now() - swStartTime);
                }
                return swElapsed;
            }

            function updateStopwatchDisplay() {
                stopwatchDisplay.textContent = formatStopwatch(getCurrentStopwatchMs());
            }

            function startStopwatch() {
                if (swRunning) return;
                swRunning = true;
                swStartTime = performance.now();
                swInterval = setInterval(() => {
                    stopwatchDisplay.textContent = formatStopwatch(swElapsed + (performance.now() - swStartTime));
                }, 20);
                updateStopwatchDisplay();
            }

            function pauseStopwatch() {
                if (!swRunning) return;
                swRunning = false;
                swElapsed += performance.now() - swStartTime;
                clearInterval(swInterval);
                swInterval = null;
                updateStopwatchDisplay();
            }

            function resetStopwatch() {
                if (swRunning) {
                    swRunning = false;
                    clearInterval(swInterval);
                    swInterval = null;
                }
                swElapsed = 0;
                swLaps = [];
                lapListEl.innerHTML = '';
                stopwatchDisplay.textContent = '00:00.00';
            }

            function recordLap() {
                if (!swRunning && swElapsed === 0) return; // nothing to lap
                const current = getCurrentStopwatchMs();
                swLaps.push(current);
                renderLaps();
            }

            function renderLaps() {
                if (swLaps.length === 0) { lapListEl.innerHTML = ''; return; }
                lapListEl.innerHTML = swLaps.map((ms, idx) => `
                    <div class="lap-item">
                        <span>Lap ${idx+1}</span>
                        <span>${formatStopwatch(ms)}</span>
                    </div>
                `).join('');
            }

            swStart.addEventListener('click', startStopwatch);
            swPause.addEventListener('click', pauseStopwatch);
            swReset.addEventListener('click', resetStopwatch);
            swLap.addEventListener('click', recordLap);

            // ---------- TIMER MODULE ----------
            const timerDisplay = document.getElementById('timerDisplay');
            const timerProgress = document.getElementById('timerProgress');
            const timerMinutes = document.getElementById('timerMinutes');
            const timerSeconds = document.getElementById('timerSeconds');
            const timerStartBtn = document.getElementById('timerStart');
            const timerPauseBtn = document.getElementById('timerPause');
            const timerResetBtn = document.getElementById('timerReset');
            const presetBtns = document.querySelectorAll('.timer-presets .btn');

            let timerRunning = false;
            let timerEndTime = 0;           // timestamp when timer ends
            let timerRemaining = 0;         // ms remaining when paused
            let timerInterval = null;
            let timerTotalSet = 0;          // total ms of the timer

            function formatTimer(ms) {
                if (ms < 0) ms = 0;
                const totalSec = Math.floor(ms / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }

            function updateTimerDisplay(ms) {
                if (ms === undefined) ms = timerRunning ? Math.max(0, timerEndTime - performance.now()) : timerRemaining;
                timerDisplay.textContent = formatTimer(ms);
                if (timerTotalSet > 0) {
                    const pct = Math.min(100, (ms / timerTotalSet) * 100);
                    timerProgress.textContent = `${Math.round(pct)}% remaining`;
                } else {
                    timerProgress.textContent = '';
                }
            }

            function setTimerFromInputs() {
                if (timerRunning) return;
                let mins = parseInt(timerMinutes.value, 10) || 0;
                let secs = parseInt(timerSeconds.value, 10) || 0;
                if (mins < 0) mins = 0; if (mins > 99) mins = 99;
                if (secs < 0) secs = 0; if (secs > 59) secs = 59;
                timerMinutes.value = mins;
                timerSeconds.value = secs;
                const totalMs = (mins * 60 + secs) * 1000;
                timerRemaining = totalMs;
                timerTotalSet = totalMs;
                timerEndTime = 0;
                updateTimerDisplay(totalMs);
            }

            function startTimer() {
                if (timerRunning) return;

                // if paused with remaining time, resume
                if (timerRemaining > 0) {
                    timerEndTime = performance.now() + timerRemaining;
                    timerRunning = true;
                } else {
                    // fresh start from inputs
                    let mins = parseInt(timerMinutes.value, 10) || 0;
                    let secs = parseInt(timerSeconds.value, 10) || 0;
                    const totalMs = (mins * 60 + secs) * 1000;
                    if (totalMs <= 0) {
                        alert('set a time greater than 0');
                        return;
                    }
                    timerTotalSet = totalMs;
                    timerEndTime = performance.now() + totalMs;
                    timerRemaining = totalMs;
                    timerRunning = true;
                }

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    const now = performance.now();
                    const remaining = Math.max(0, timerEndTime - now);
                    updateTimerDisplay(remaining);
                    if (remaining <= 0) {
                        // timer finished
                        clearInterval(timerInterval);
                        timerInterval = null;
                        timerRunning = false;
                        timerRemaining = 0;
                        updateTimerDisplay(0);
                        timerProgress.textContent = 'done!';
                        // sound: three quick beeps
                        beep(1000, 0.15, 'square', 0.35);
                        setTimeout(() => beep(1000, 0.15, 'square', 0.35), 250);
                        setTimeout(() => beep(1000, 0.15, 'square', 0.35), 500);
                        alert('⏳ Timer finished!');
                    }
                }, 100);
            }

            function pauseTimer() {
                if (!timerRunning) return;
                timerRunning = false;
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                const now = performance.now();
                timerRemaining = Math.max(0, timerEndTime - now);
                updateTimerDisplay(timerRemaining);
            }

            function resetTimer() {
                if (timerRunning) {
                    timerRunning = false;
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }
                timerRemaining = 0;
                timerEndTime = 0;
                setTimerFromInputs();
            }

            // event listeners
            timerStartBtn.addEventListener('click', startTimer);
            timerPauseBtn.addEventListener('click', pauseTimer);
            timerResetBtn.addEventListener('click', resetTimer);

            timerMinutes.addEventListener('input', () => { if (!timerRunning) setTimerFromInputs(); });
            timerSeconds.addEventListener('input', () => { if (!timerRunning) setTimerFromInputs(); });

            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (timerRunning) return;
                    const secs = parseInt(btn.dataset.preset, 10);
                    const mins = Math.floor(secs / 60);
                    const remSecs = secs % 60;
                    timerMinutes.value = mins;
                    timerSeconds.value = remSecs;
                    setTimerFromInputs();
                });
            });

            // initialize
            setTimerFromInputs();

            // ---------- CLEANUP ON UNLOAD ----------
            window.addEventListener('beforeunload', () => {
                stopAlarmSound();
                if (swInterval) clearInterval(swInterval);
                if (timerInterval) clearInterval(timerInterval);
            });
        })();
    </script>
</body>
</html>
